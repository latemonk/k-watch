[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
command=/bin/sh -c "exec redis-server --requirepass \"$REDIS_PASSWORD\" --port 6379 --bind 127.0.0.1 --dir /tmp/redis-data --maxmemory 192mb --maxmemory-policy allkeys-lru --save ''"
priority=5
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis-rest]
command=node /rest/redis-rest-proxy.mjs
directory=/rest
priority=10
autostart=true
autorestart=true
environment=PORT="8079"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ais-relay]
command=node /app/scripts/ais-relay.cjs
directory=/app
priority=15
autostart=true
autorestart=true
environment=PORT="3004",NODE_OPTIONS="--max-old-space-size=512"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:kcg-seeders]
command=/bin/sh /app/scripts/kcg-country-seeders.sh
directory=/app
priority=18
autostart=true
autorestart=true
environment=NODE_OPTIONS="--max-old-space-size=256"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worldmonitor-api]
command=node /app/local-api-server.mjs
directory=/app
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 08-17 실사고 재발 방지: worldmonitor-api 가 「살아 있는데 핸들러만 영영
# 안 끝나는」 웨지에 빠지면 컨테이너 HEALTHCHECK(/api/sidecar-health)는
# 초록을 유지한다. 이 워치독이 실핸들러 경로를 프로브해 연속 무응답이면
# 그 프로세스만 pkill → 아래 autorestart 가 되살린다. 컨테이너 재시작은
# 내장 redis 시드가 날아가므로 금지. KILL_PATTERN 은 worldmonitor-api 의
# command 문자열과 반드시 일치해야 한다.
[program:api-watchdog]
command=node /app/scripts/api-watchdog.mjs
directory=/app
priority=22
autostart=true
autorestart=true
environment=NODE_OPTIONS="--max-old-space-size=64"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 09-02: K-Watch Pro 자동갱신 워커. DATABASE_URL·TOSS_SECRET_KEY 없으면 대기만 한다.
[program:kw-billing]
command=node /app/scripts/kw-billing-renewal.mjs
directory=/app
priority=23
autostart=true
autorestart=true
environment=NODE_OPTIONS="--max-old-space-size=96"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /tmp/nginx.conf -g "daemon off;"
priority=25
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
